name: Repository security policy gates
on:
  pull_request:
  push:
    branches: [main, phase0/foundation]
permissions:
  contents: read
jobs:
  repository-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate CI/action trust boundaries and Dependabot configuration
        run: python3 .github/scripts/check_repo_security.py
