name: Python locked dependency audit
on:
  pull_request:
  push:
    branches: [main, phase0/foundation]
  schedule:
    - cron: '47 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.15"
          python-version: "3.12"
      - name: Verify dependency resolution is committed and current
        run: uv lock --check
      - name: Export exact locked runtime dependency set for vulnerability scan
        run: uv export --locked --no-dev --no-emit-project --output-file requirements-runtime.audit.txt
      - name: Reject known vulnerable locked runtime dependencies
        run: uv tool run --from pip-audit pip-audit --requirement requirements-runtime.audit.txt --disable-pip --no-deps
      - name: Export full locked development and runtime dependency set
        run: uv export --locked --extra dev --no-emit-project --output-file requirements-all.audit.txt
      - name: Reject known vulnerable locked development dependencies
        run: uv tool run --from pip-audit pip-audit --requirement requirements-all.audit.txt --disable-pip --no-deps
