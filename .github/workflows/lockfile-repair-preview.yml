name: Temporary certifi lock repair preview
on:
  pull_request:
permissions:
  contents: read
jobs:
  preview-verified-lock-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          python-version: "3.12"
      - name: Resolve only the security-fixed certifi version in disposable runner
        run: |
          uv lock --upgrade-package certifi
          uv lock --check
          git diff --check
          git diff -- uv.lock
          grep -A 2 'name = "certifi"' uv.lock | head -n 3
