name: Python services foundation CI
on:
  pull_request:
  push:
    branches: [main, phase0/foundation]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          python-version: ${{ matrix.python-version }}
      - name: Reject stale or missing lockfile
        run: uv lock --check
      - name: Install exact locked runtime and development dependencies
        run: uv sync --locked --extra dev
      - name: Ruff static analysis
        run: uv run --locked --extra dev ruff check .
      - name: Python API configuration and health tests
        run: uv run --locked --extra dev python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Python production image from locked dependencies
        run: docker build --tag renivet-python-services:ci .
      - name: Start isolated staging container (no credentials or model downloads)
        run: |
          docker run --detach --name renivet-python-ci \
            --publish 127.0.0.1:48000:8000 \
            --env RENIVET_ENVIRONMENT=staging \
            renivet-python-services:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:48000/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs renivet-python-ci
          exit 1
      - name: Ensure staging does not expose OpenAPI
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:48000/docs)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:48000/openapi.json)" = "404"
      - name: Remove disposable CI container
        if: always()
        run: docker rm --force renivet-python-ci || true
