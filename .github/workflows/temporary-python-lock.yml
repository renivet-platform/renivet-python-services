# Temporary CI-only lock generator on the reviewed PR branch.
# This workflow does not have write access, publish artifacts or access local machines.
name: Python temporary uv lock generation
on:
  pull_request:
permissions:
  contents: read
jobs:
  create-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # setup-uv v9.0.0
        with:
          version: "0.12.15"
          python-version: "3.12"
      - name: Resolve universal Python dependency lock without modifying source
        run: uv lock --python 3.12
      - name: Verify pinned dev and runtime install in CI only
        run: |
          uv sync --locked --extra dev --python 3.12
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev pytest -q
      - name: Emit lockfile to be committed through reviewed GitHub connector
        run: |
          echo RENIVET_UV_LOCK_BEGIN
          sed 's/^/RENIVET_UV_LOCK_LINE:/' uv.lock
          echo RENIVET_UV_LOCK_END
