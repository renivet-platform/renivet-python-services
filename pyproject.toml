[project]
name = "renivet-python-services"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.162.0,<1", "uvicorn[standard]>=0.54.0,<1", "pydantic-settings>=2.16.2,<3"]
[project.optional-dependencies]
dev = ["pytest>=9.2.0,<10", "httpx>=0.27,<1", "ruff>=0.17.3,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
